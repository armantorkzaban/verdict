[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verdict"
version = "0.2.0"
description = "Evidence-graded product & research verdict ledger, deterministic epistemic checker, academic DB search (ScienceDirect, IEEE, ACM, Springer, arXiv), and HTML trajectory report."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = []

[project.scripts]
verdict = "verdict.cli:main"

[tool.setuptools.packages.find]
include = ["verdict*"]

